# Codemagic CI/CD configuration for US Calendar (iOS -> TestFlight).
# Docs: https://docs.codemagic.io/yaml/yaml-getting-started/
#
# ── ONE-TIME SETUP IN THE CODEMAGIC UI ─────────────────────────────────────────
# 1. Team settings -> Integrations -> App Store Connect: API key named exactly
#    `codemagic_appstore` (role App Manager).
# 2. App Store Connect -> Apps: app record for bundle id com.gihan.uscalendar.
#    Paste its numeric Apple ID into APP_STORE_APPLE_ID below to enable automatic
#    build-number increment (recommended so uploads never clash with earlier builds).
# Signing is automatic: `fetch-signing-files ... --create` registers the Bundle ID
# and creates/reuses the distribution certificate + provisioning profile from
# signing/codemagic_cert_key.pem (the shared key used across the calendar apps).
# ───────────────────────────────────────────────────────────────────────────────

workflows:
  ios-testflight:
    name: iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: codemagic_appstore

    environment:
      vars:
        BUNDLE_ID: "com.gihan.uscalendar"
        # To enable automatic build-number increment, add the app's numeric App Store
        # Connect Apple ID as a var here, e.g.  APP_STORE_APPLE_ID: "1234567890"
        # (Codemagic rejects an empty-string var, so it is left out until you have the ID;
        # while unset, the build falls back to the pubspec build number.)
      flutter: stable
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Initialize keychain
        script: |
          keychain initialize

      - name: Fetch signing files (creates cert + profile if missing)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:$CM_BUILD_DIR/signing/codemagic_cert_key.pem \
            --create

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Apply provisioning profiles to Xcode project
        script: |
          xcode-project use-profiles

      - name: Disable Swift Package Manager
        script: |
          # google_mobile_ads uses CocoaPods while webview_flutter_wkwebview (pulled in
          # transitively) ships as an SPM package; with SPM enabled `pod install` breaks.
          # Force CocoaPods-only by turning SPM off on the fresh Codemagic Flutter install.
          flutter config --no-enable-swift-package-manager

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Flutter build IPA
        script: |
          # Version name comes from pubspec.yaml. The build number must be
          # strictly higher than any build already uploaded for this marketing
          # version, or App Store Connect rejects it ("bundle version must be
          # higher than the previously uploaded version").
          #
          # Preferred: when APP_STORE_APPLE_ID is set, use the latest TestFlight
          # build number + 1 (keeps build numbers clean and sequential).
          #
          # Fallback (no Apple ID): use the Unix timestamp as the build number.
          # It increases every second, so every upload is guaranteed higher than
          # the last with no manual pubspec bumps. `date +%s` stays below the
          # 2^31 CFBundleVersion ceiling until 2038.
          if [ -n "$APP_STORE_APPLE_ID" ]; then
            BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0) + 1))
          else
            BUILD_NUMBER=$(date +%s)
          fi
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

      email:
        recipients:
          - gihangamage2015@gmail.com
        notify:
          success: true
          failure: true

  android-release:
    name: Android Release (Play Store)
    # Linux instances require billing to be enabled on personal accounts.
    # mac_mini_m2 draws from the same free 500 min/month pool as the iOS
    # workflow and can build Android app bundles just fine.
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      android_signing:
        # Same physical upload key used to sign all the calendar app variants
        # (SL/US/Thai) — already uploaded to Codemagic under this reference,
        # no new keystore upload needed.
        - srilankan_calendar_keystore
      groups:
        - google_play_credentials
      vars:
        PACKAGE_NAME: "com.gihan.uscalendar"
      flutter: stable

    cache:
      cache_paths:
        - $HOME/.pub-cache

    scripts:
      - name: Set up key.properties from the Codemagic-managed keystore
        script: |
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build appbundle
        script: |
          # Google Play requires each upload to have a strictly higher versionCode
          # than the last. Ask Play for the latest one across all tracks and bump it,
          # falling back to Codemagic's own build counter if this is the very first
          # API-driven upload.
          LATEST_BUILD_NUMBER=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" 2>/dev/null || echo "")
          if [ -z "$LATEST_BUILD_NUMBER" ]; then
            UPDATED_BUILD_NUMBER=$BUILD_NUMBER
          else
            UPDATED_BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))
          fi
          flutter build appbundle --release --build-number=$UPDATED_BUILD_NUMBER

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - flutter_drive.log

    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: production
        # rollout_fraction omitted on purpose -> releases to 100% of users
        # immediately. Add `rollout_fraction: 0.2` (etc.) here if you'd rather
        # stage it, or change `track:` to `internal`/`beta` to test first.

      email:
        recipients:
          - gihangamage2015@gmail.com
        notify:
          success: true
          failure: true
